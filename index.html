<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وصل طلب - منتجات أمين الساعدي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        /* ===== أزرار التحكم (تختفي عند الطباعة) ===== */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ctrl-btn {
            padding: 14px 30px;
            border: none;
            border-radius: 14px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn:hover {
            transform: translateY(-2px);
        }

        .btn-print {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            box-shadow: 0 8px 25px rgba(0,184,148,0.35);
        }

        .btn-copies {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 8px 25px rgba(102,126,234,0.35);
        }

        .copies-input {
            width: 60px;
            padding: 5px;
            border: 2px solid white;
            border-radius: 8px;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .copies-input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        /* ===== الوصل ===== */
        .receipt-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .receipt {
            background: white;
            width: 100%;
            padding: 35px 30px;
            position: relative;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            margin-bottom: 30px;
        }

        /* ===== العلامة المائية الشفافة (الختم) ===== */
        .watermark-stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            width: 280px;
            height: 280px;
            border: 4px solid rgba(102, 126, 234, 0.06);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
        }

        .watermark-stamp::before {
            content: '';
            position: absolute;
            width: 260px;
            height: 260px;
            border: 2px solid rgba(102, 126, 234, 0.04);
            border-radius: 50%;
        }

        .watermark-stamp::after {
            content: '';
            position: absolute;
            width: 240px;
            height: 240px;
            border: 1px dashed rgba(102, 126, 234, 0.05);
            border-radius: 50%;
        }

        .watermark-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-family: 'Amiri', serif;
            font-size: 28px;
            font-weight: 700;
            color: rgba(102, 126, 234, 0.045);
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            text-align: center;
            line-height: 1.6;
        }

        .watermark-sub {
            font-size: 14px;
            display: block;
            letter-spacing: 8px;
        }

        /* ===== باقي العناصر فوق العلامة المائية ===== */
        .receipt > *:not(.watermark-stamp):not(.watermark-text) {
            position: relative;
            z-index: 2;
        }

        /* ===== رأس الوصل ===== */
        .receipt-header {
            text-align: center;
            padding-bottom: 18px;
            margin-bottom: 20px;
            border-bottom: 2px solid #222;
        }

        .brand-name {
            font-family: 'Amiri', serif;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        .receipt-title {
            font-size: 15px;
            color: #555;
            font-weight: 600;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .header-line {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }

        .header-line .line {
            width: 50px;
            height: 1px;
            background: #999;
        }

        .header-line .dot {
            width: 5px;
            height: 5px;
            background: #667eea;
            border-radius: 50%;
        }

        /* ===== رقم الوصل والتاريخ ===== */
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .meta-item {
            font-size: 13px;
            color: #444;
            font-weight: 600;
        }

        .meta-item .meta-label {
            color: #999;
            font-size: 11px;
        }

        .meta-line {
            flex: 1;
            border-bottom: 1px dotted #bbb;
            margin: 0 8px;
            min-width: 60px;
            height: 18px;
        }

        /* ===== حقول الكتابة ===== */
        .fields {
            margin-bottom: 15px;
        }

        .field-row {
            display: flex;
            align-items: flex-end;
            margin-bottom: 22px;
            gap: 8px;
        }

        .field-label {
            font-size: 15px;
            font-weight: 800;
            color: #1a1a1a;
            white-space: nowrap;
            padding-bottom: 4px;
            min-width: fit-content;
        }

        .field-line {
            flex: 1;
            border-bottom: 1.5px dotted #888;
            min-height: 28px;
        }

        /* حقل العنوان - سطرين */
        .field-row-multi {
            margin-bottom: 5px;
        }

        .field-row-multi .field-line {
            min-height: 28px;
        }

        .extra-line {
            border-bottom: 1.5px dotted #888;
            min-height: 28px;
            margin-bottom: 22px;
            margin-right: 0;
        }

        /* ===== قسم السعر ===== */
        .price-field {
            display: flex;
            align-items: center;
            margin: 25px 0;
            padding: 18px 20px;
            border: 2px solid #222;
            border-radius: 12px;
            background: #fafafa;
        }

        .price-label {
            font-size: 17px;
            font-weight: 900;
            color: #1a1a1a;
            white-space: nowrap;
            margin-left: 10px;
        }

        .price-line {
            flex: 1;
            border-bottom: 2px dotted #555;
            min-height: 30px;
            margin: 0 10px;
        }

        .price-currency {
            font-size: 15px;
            font-weight: 800;
            color: #667eea;
            white-space: nowrap;
        }

        /* ===== فاصل ===== */
        .separator {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 20px 0;
        }

        .separator .sep-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to left, transparent, #ccc, transparent);
        }

        .separator .sep-diamond {
            width: 6px;
            height: 6px;
            background: #667eea;
            transform: rotate(45deg);
            opacity: 0.25;
        }

        /* ===== حقل الملاحظات ===== */
        .notes-section {
            margin-bottom: 20px;
        }

        .notes-label {
            font-size: 13px;
            font-weight: 700;
            color: #666;
            margin-bottom: 10px;
        }

        .notes-lines {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .note-line {
            border-bottom: 1px dotted #aaa;
            min-height: 22px;
        }

        /* ===== توقيع ===== */
        .signature-section {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 15px;
        }

        .sig-block {
            text-align: center;
            width: 45%;
        }

        .sig-label {
            font-size: 12px;
            color: #888;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .sig-line {
            border-bottom: 1.5px solid #999;
        }

        /* ===== ذيل الوصل ===== */
        .receipt-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px solid #222;
        }

        .footer-brand {
            font-family: 'Amiri', serif;
            font-size: 13px;
            color: rgba(102, 126, 234, 0.35);
            font-weight: 700;
            letter-spacing: 3px;
        }

        .footer-thanks {
            font-family: 'Amiri', serif;
            font-size: 16px;
            color: #555;
            margin-bottom: 5px;
        }

        /* ===== خط مقص ===== */
        .cut-line {
            border: none;
            border-top: 2px dashed #bbb;
            margin: 0;
            position: relative;
        }

        .cut-line::before {
            content: '✂';
            position: absolute;
            top: -12px;
            left: 10px;
            font-size: 16px;
            color: #bbb;
            background: #f0f0f0;
            padding: 0 5px;
        }

        /* ===== تنسيق الطباعة ===== */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .controls {
                display: none !important;
            }

            .receipt-wrapper {
                max-width: 100% !important;
            }

            .receipt {
                border: none !important;
                box-shadow: none !important;
                page-break-inside: avoid;
                page-break-after: always;
                margin: 0 auto;
                max-width: 400px;
            }

            .receipt:last-child {
                page-break-after: auto;
            }

            .cut-line {
                display: none;
            }

            /* الحفاظ على الألوان */
            .watermark-stamp,
            .watermark-text,
            .header-line .dot,
            .separator .sep-diamond,
            .price-currency,
            .footer-brand {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            .watermark-stamp {
                border-color: rgba(102, 126, 234, 0.06) !important;
            }

            .watermark-text {
                color: rgba(102, 126, 234, 0.045) !important;
            }

            .price-field {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background: #fafafa !important;
            }
        }

        @media (max-width: 480px) {
            .receipt {
                padding: 25px 18px;
            }

            .brand-name {
                font-size: 24px;
            }

            .watermark-stamp {
                width: 220px;
                height: 220px;
            }

            .watermark-text {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- أزرار التحكم -->
    <div class="controls">
        <button class="ctrl-btn btn-print" onclick="window.print()">
            🖨️ طباعة الوصل
        </button>
        <button class="ctrl-btn btn-copies" onclick="setCopies()">
            📄 عدد النسخ:
            <input type="number" class="copies-input" id="copiesCount" value="1" min="1" max="10" onclick="event.stopPropagation()">
        </button>
    </div>

    <!-- حاوية الوصول -->
    <div class="receipt-wrapper" id="receiptWrapper">

        <!-- وصل واحد (يتكرر حسب عدد النسخ) -->
        <div class="receipt" id="receiptTemplate">

            <!-- العلامة المائية / الختم الشفاف -->
            <div class="watermark-stamp"></div>
            <div class="watermark-text">
                منتجات أمين الساعدي
                <span class="watermark-sub">AMIN AL-SAADI</span>
            </div>

            <!-- رأس الوصل -->
            <div class="receipt-header">
                <div class="brand-name">📦 منتجات أمين الساعدي</div>
                <div class="receipt-title">— وصل استلام طلب —</div>
                <div class="header-line">
                    <div class="line"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="line"></div>
                </div>
            </div>

            <!-- رقم الوصل والتاريخ -->
            <div class="meta-row">
                <div class="meta-item">
                    <span class="meta-label">رقم الوصل:</span>
                </div>
                <div class="meta-line"></div>
                <div class="meta-item">
                    <span class="meta-label">التاريخ:</span>
                </div>
                <div class="meta-line"></div>
            </div>

            <!-- الحقول الفارغة -->
            <div class="fields">

                <!-- اسم الزبون -->
                <div class="field-row">
                    <div class="field-label">اسم الزبون :</div>
                    <div class="field-line"></div>
                </div>

                <!-- عنوان الزبون -->
                <div class="field-row field-row-multi">
                    <div class="field-label">عنوان الزبون :</div>
                    <div class="field-line"></div>
                </div>
                <div class="extra-line"></div>

                <!-- رقم الهاتف -->
                <div class="field-row">
                    <div class="field-label">رقم الهاتف :</div>
                    <div class="field-line"></div>
                </div>

            </div>

            <!-- فاصل -->
            <div class="separator">
                <div class="sep-line"></div>
                <div class="sep-diamond"></div>
                <div class="sep-line"></div>
                <div class="sep-diamond"></div>
                <div class="sep-line"></div>
            </div>

            <!-- السعر -->
            <div class="price-field">
                <div class="price-label">💰 السعر الكامل :</div>
                <div class="price-line"></div>
                <div class="price-currency">د.ع</div>
            </div>

            <!-- ملاحظات -->
            <div class="notes-section">
                <div class="notes-label">📝 ملاحظات :</div>
                <div class="notes-lines">
                    <div class="note-line"></div>
                    <div class="note-line"></div>
                </div>
            </div>

            <!-- توقيع -->
            <div class="signature-section">
                <div class="sig-block">
                    <div class="sig-label">توقيع البائع</div>
                    <div class="sig-line"></div>
                </div>
                <div class="sig-block">
                    <div class="sig-label">توقيع المستلم</div>
                    <div class="sig-line"></div>
                </div>
            </div>

            <!-- ذيل الوصل -->
            <div class="receipt-footer">
                <div class="footer-thanks">شكراً لتعاملكم معنا ♥</div>
                <div class="footer-brand">— منتجات أمين الساعدي —</div>
            </div>

        </div>

    </div>

    <script>
        function setCopies() {
            const count = parseInt(document.getElementById('copiesCount').value) || 1;
            const wrapper = document.getElementById('receiptWrapper');
            const template = document.getElementById('receiptTemplate');

            // مسح الوصول القديمة
            wrapper.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const clone = template.cloneNode(true);
                clone.removeAttribute('id');
                wrapper.appendChild(clone);

                // خط القص بين النسخ
                if (i < count - 1) {
                    const cutLine = document.createElement('hr');
                    cutLine.className = 'cut-line';
                    wrapper.appendChild(cutLine);
                }
            }
        }

        // تهيئة النسخة الأولى
        document.getElementById('copiesCount').addEventListener('change', setCopies);
    </script>

</body>
</html>
