<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وصل طلب - منتجات أمين الساعدي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #e5e5e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            min-height: 100vh;
        }

        /* ===== أزرار التحكم ===== */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ctrl-btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn:hover {
            transform: translateY(-2px);
        }

        .btn-print {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            box-shadow: 0 8px 25px rgba(0,184,148,0.35);
        }

        .btn-copies {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 8px 25px rgba(102,126,234,0.35);
        }

        .copies-input {
            width: 60px;
            padding: 6px;
            border: 2px solid white;
            border-radius: 8px;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        /* ===== الوصل - مربع ===== */
        .receipt-wrapper {
            width: 100%;
            max-width: 500px;
        }

        .receipt {
            background: white;
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 30px 28px;
            position: relative;
            overflow: hidden;
            border: 2px solid #222;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        /* ===== الختم الشفاف الواضح ===== */
        .stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-18deg);
            width: 260px;
            height: 260px;
            border: 5px solid rgba(200, 30, 30, 0.28);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
        }

        .stamp::before {
            content: '';
            position: absolute;
            width: 240px;
            height: 240px;
            border: 2px solid rgba(200, 30, 30, 0.25);
            border-radius: 50%;
        }

        .stamp-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-18deg);
            text-align: center;
            pointer-events: none;
            z-index: 1;
            width: 220px;
        }

        .stamp-title {
            font-family: 'Amiri', serif;
            font-size: 26px;
            font-weight: 700;
            color: rgba(200, 30, 30, 0.32);
            line-height: 1.3;
            margin-bottom: 5px;
        }

        .stamp-divider {
            width: 60px;
            height: 2px;
            background: rgba(200, 30, 30, 0.28);
            margin: 6px auto;
        }

        .stamp-sub {
            font-family: 'Amiri', serif;
            font-size: 13px;
            font-weight: 700;
            color: rgba(200, 30, 30, 0.3);
            letter-spacing: 3px;
        }

        /* ===== باقي العناصر فوق الختم ===== */
        .receipt > *:not(.stamp):not(.stamp-content) {
            position: relative;
            z-index: 2;
        }

        /* ===== رأس الوصل ===== */
        .receipt-header {
            text-align: center;
            padding-bottom: 14px;
            margin-bottom: 15px;
            border-bottom: 2px solid #222;
        }

        .brand-name {
            font-family: 'Amiri', serif;
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }

        .receipt-title {
            font-size: 13px;
            color: #555;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* ===== رقم الوصل والتاريخ ===== */
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 15px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .meta-label {
            font-size: 13px;
            font-weight: 700;
            color: #333;
            white-space: nowrap;
        }

        .meta-line {
            flex: 1;
            border-bottom: 1.5px dotted #888;
            min-height: 20px;
        }

        /* ===== الحقول ===== */
        .fields {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .field-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 8px;
        }

        .field-label {
            font-size: 15px;
            font-weight: 800;
            color: #1a1a1a;
            white-space: nowrap;
            padding-bottom: 4px;
        }

        .field-line {
            flex: 1;
            border-bottom: 1.5px dotted #666;
            min-height: 26px;
        }

        .extra-line {
            border-bottom: 1.5px dotted #666;
            min-height: 26px;
            margin-bottom: 8px;
        }

        /* ===== قسم السعر ===== */
        .price-field {
            display: flex;
            align-items: center;
            margin: 12px 0 8px 0;
            padding: 14px 18px;
            border: 2.5px solid #222;
            border-radius: 10px;
            background: rgba(250, 250, 250, 0.7);
            gap: 10px;
        }

        .price-label {
            font-size: 16px;
            font-weight: 900;
            color: #1a1a1a;
            white-space: nowrap;
        }

        .price-line {
            flex: 1;
            border-bottom: 2px dotted #444;
            min-height: 28px;
        }

        .price-currency {
            font-size: 15px;
            font-weight: 800;
            color: #c81e1e;
            white-space: nowrap;
        }

        /* ===== ذيل الوصل ===== */
        .receipt-footer {
            text-align: center;
            padding-top: 10px;
            border-top: 2px solid #222;
            margin-top: 10px;
        }

        .footer-thanks {
            font-family: 'Amiri', serif;
            font-size: 15px;
            color: #555;
            margin-bottom: 3px;
        }

        .footer-brand {
            font-family: 'Amiri', serif;
            font-size: 12px;
            color: rgba(102, 126, 234, 0.5);
            font-weight: 700;
            letter-spacing: 3px;
        }

        /* ===== تنسيق الطباعة ===== */
        @media print {
            @page {
                size: A5;
                margin: 10mm;
            }

            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .controls {
                display: none !important;
            }

            .receipt-wrapper {
                max-width: 100% !important;
            }

            .receipt {
                border: 2px solid #222 !important;
                box-shadow: none !important;
                page-break-inside: avoid;
                page-break-after: always;
                margin: 0 auto 20px auto;
                max-width: 500px;
            }

            .receipt:last-child {
                page-break-after: auto;
            }

            /* الحفاظ على ألوان الختم */
            .stamp,
            .stamp-content,
            .stamp-title,
            .stamp-sub,
            .stamp-divider,
            .price-currency,
            .footer-brand,
            .price-field {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            .stamp {
                border-color: rgba(200, 30, 30, 0.28) !important;
            }

            .stamp-title,
            .stamp-sub {
                color: rgba(200, 30, 30, 0.32) !important;
            }
        }

        @media (max-width: 480px) {
            .receipt {
                padding: 22px 18px;
            }

            .brand-name {
                font-size: 22px;
            }

            .stamp {
                width: 200px;
                height: 200px;
            }

            .stamp::before {
                width: 185px;
                height: 185px;
            }

            .stamp-content {
                width: 170px;
            }

            .stamp-title {
                font-size: 20px;
            }

            .stamp-sub {
                font-size: 11px;
            }

            .field-label {
                font-size: 13px;
            }

            .price-label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- أزرار التحكم -->
    <div class="controls">
        <button class="ctrl-btn btn-print" onclick="window.print()">
            🖨️ طباعة الوصل
        </button>
        <button class="ctrl-btn btn-copies" onclick="setCopies()">
            📄 عدد النسخ:
            <input type="number" class="copies-input" id="copiesCount" value="1" min="1" max="10" onclick="event.stopPropagation()">
        </button>
    </div>

    <!-- حاوية الوصل -->
    <div class="receipt-wrapper" id="receiptWrapper">

        <!-- الوصل -->
        <div class="receipt" id="receiptTemplate">

            <!-- الختم الشفاف الواضح -->
            <div class="stamp"></div>
            <div class="stamp-content">
                <div class="stamp-title">منتجات<br>أمين الساعدي</div>
                <div class="stamp-divider"></div>
                <div class="stamp-sub">AMIN AL-SAADI</div>
            </div>

            <!-- رأس الوصل -->
            <div class="receipt-header">
                <div class="brand-name">📦 منتجات أمين الساعدي</div>
                <div class="receipt-title">— وصل استلام طلب —</div>
            </div>

            <!-- رقم الوصل والتاريخ -->
            <div class="meta-row">
                <div class="meta-item">
                    <span class="meta-label">رقم الوصل:</span>
                    <div class="meta-line"></div>
                </div>
                <div class="meta-item">
                    <span class="meta-label">التاريخ:</span>
                    <div class="meta-line"></div>
                </div>
            </div>

            <!-- الحقول -->
            <div class="fields">

                <!-- اسم الزبون -->
                <div class="field-row">
                    <div class="field-label">اسم الزبون :</div>
                    <div class="field-line"></div>
                </div>

                <!-- عنوان الزبون - سطرين -->
                <div class="field-row">
                    <div class="field-label">عنوان الزبون :</div>
                    <div class="field-line"></div>
                </div>
                <div class="extra-line"></div>

                <!-- رقم الهاتف -->
                <div class="field-row">
                    <div class="field-label">رقم الهاتف :</div>
                    <div class="field-line"></div>
                </div>

                <!-- السعر -->
                <div class="price-field">
                    <div class="price-label">💰 السعر الكامل :</div>
                    <div class="price-line"></div>
                    <div class="price-currency">د.ع</div>
                </div>

            </div>

            <!-- ذيل الوصل -->
            <div class="receipt-footer">
                <div class="footer-thanks">شكراً لتعاملكم معنا ♥</div>
                <div class="footer-brand">— منتجات أمين الساعدي —</div>
            </div>

        </div>

    </div>

    <script>
        function setCopies() {
            const count = parseInt(document.getElementById('copiesCount').value) || 1;
            const wrapper = document.getElementById('receiptWrapper');
            const template = document.getElementById('receiptTemplate');

            // احتفظ بالنسخة الأصلية
            const originalHTML = template.outerHTML;

            wrapper.innerHTML = '';

            for (let i = 0; i < count; i++) {
                wrapper.insertAdjacentHTML('beforeend', originalHTML);
            }
        }
    </script>

</body>
</html>
