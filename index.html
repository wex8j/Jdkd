<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وصل طلب - منتجات أمين الساعدي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #e5e5e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            min-height: 100vh;
        }

        /* ===== أزرار التحكم ===== */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ctrl-btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ctrl-btn:hover {
            transform: translateY(-2px);
        }

        .btn-print {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            box-shadow: 0 8px 25px rgba(0,184,148,0.35);
        }

        .btn-copies {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 8px 25px rgba(102,126,234,0.35);
        }

        .copies-input {
            width: 60px;
            padding: 6px;
            border: 2px solid white;
            border-radius: 8px;
            text-align: center;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        /* ===== الوصل ===== */
        .receipt-wrapper {
            width: 100%;
            max-width: 500px;
        }

        .receipt {
            background: white;
            width: 100%;
            padding: 28px 25px;
            position: relative;
            overflow: hidden;
            border: 2px solid #222;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            min-height: 580px;
        }

        /* ===== الختم الشفاف ===== */
        .stamp-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-18deg);
            width: 260px;
            height: 260px;
            border: 4px solid rgba(200, 30, 30, 0.10);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .stamp-bg::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 2px solid rgba(200, 30, 30, 0.08);
            border-radius: 50%;
        }

        .stamp-text-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-18deg);
            text-align: center;
            pointer-events: none;
            z-index: 0;
            width: 220px;
        }

        .stamp-title-bg {
            font-family: 'Amiri', serif;
            font-size: 26px;
            font-weight: 700;
            color: rgba(200, 30, 30, 0.11);
            line-height: 1.3;
            margin-bottom: 5px;
        }

        .stamp-divider-bg {
            width: 60px;
            height: 2px;
            background: rgba(200, 30, 30, 0.10);
            margin: 6px auto;
        }

        .stamp-sub-bg {
            font-family: 'Amiri', serif;
            font-size: 13px;
            font-weight: 700;
            color: rgba(200, 30, 30, 0.11);
            letter-spacing: 3px;
        }

        .receipt > *:not(.stamp-bg):not(.stamp-text-bg) {
            position: relative;
            z-index: 2;
            background: transparent;
        }

        /* ===== رأس الوصل ===== */
        .receipt-header {
            text-align: center;
            padding-bottom: 12px;
            margin-bottom: 15px;
            border-bottom: 2px solid #222;
        }

        .brand-name {
            font-family: 'Amiri', serif;
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 3px;
            letter-spacing: 1px;
        }

        .receipt-title {
            font-size: 13px;
            color: #555;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .contact-info {
            font-size: 13px;
            color: #667eea;
            font-weight: 800;
            margin-top: 6px;
            direction: ltr;
        }

        /* ===== رقم الوصل والتاريخ ===== */
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .meta-label {
            font-size: 13px;
            font-weight: 700;
            color: #333;
            white-space: nowrap;
        }

        .meta-line {
            flex: 1;
            border-bottom: 1.5px solid #666;
            min-height: 20px;
        }

        /* ===== الحقول ===== */
        .fields {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 10px;
        }

        .field-label {
            font-size: 15px;
            font-weight: 800;
            color: #1a1a1a;
            white-space: nowrap;
            padding-bottom: 4px;
        }

        .field-line {
            flex: 1;
            border-bottom: 1.5px solid #666;
            min-height: 28px;
        }

        /* ===== قسم السعر ===== */
        .price-field {
            display: flex;
            align-items: center;
            margin: 18px 0 10px 0;
            padding: 14px 16px;
            border: 3px solid #222;
            border-radius: 12px;
            background: #fff9e6;
            gap: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }

        .price-label {
            font-size: 15px;
            font-weight: 900;
            color: #1a1a1a;
            white-space: nowrap;
        }

        .price-line {
            flex: 1;
            border-bottom: 2px solid #333;
            min-height: 28px;
        }

        .price-currency {
            font-size: 14px;
            font-weight: 900;
            color: #c81e1e;
            white-space: nowrap;
            background: white;
            padding: 4px 10px;
            border-radius: 6px;
            border: 2px solid #c81e1e;
        }

        /* ===== ذيل الوصل ===== */
        .receipt-footer {
            text-align: center;
            padding-top: 12px;
            border-top: 2px solid #222;
            margin-top: 10px;
        }

        .footer-thanks {
            font-family: 'Amiri', serif;
            font-size: 15px;
            color: #555;
            margin-bottom: 5px;
        }

        .footer-contact {
            font-size: 13px;
            color: #333;
            font-weight: 800;
            margin-bottom: 4px;
            direction: ltr;
        }

        .footer-contact span {
            color: #667eea;
            margin: 0 6px;
        }

        .footer-brand {
            font-family: 'Amiri', serif;
            font-size: 12px;
            color: rgba(102, 126, 234, 0.5);
            font-weight: 700;
            letter-spacing: 3px;
        }

        /* ===== الطباعة ===== */
        @media print {
            @page {
                size: A5;
                margin: 10mm;
            }

            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .controls {
                display: none !important;
            }

            .receipt-wrapper {
                max-width: 100% !important;
            }

            .receipt {
                border: 2px solid #222 !important;
                box-shadow: none !important;
                page-break-inside: avoid;
                page-break-after: always;
                margin: 0 auto 20px auto;
                max-width: 500px;
            }

            .receipt:last-child {
                page-break-after: auto;
            }

            .stamp-bg,
            .stamp-text-bg,
            .stamp-title-bg,
            .stamp-sub-bg,
            .stamp-divider-bg,
            .price-currency,
            .price-field,
            .footer-brand,
            .contact-info,
            .footer-contact span {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }
        }

        @media (max-width: 480px) {
            .receipt {
                padding: 22px 18px;
                min-height: 520px;
            }

            .brand-name {
                font-size: 22px;
            }

            .stamp-bg {
                width: 210px;
                height: 210px;
            }

            .stamp-text-bg {
                width: 180px;
            }

            .stamp-title-bg {
                font-size: 22px;
            }

            .stamp-sub-bg {
                font-size: 11px;
            }

            .field-label {
                font-size: 14px;
            }

            .price-label {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- أزرار التحكم -->
    <div class="controls">
        <button class="ctrl-btn btn-print" onclick="window.print()">
            🖨️ طباعة الوصل
        </button>
        <button class="ctrl-btn btn-copies" onclick="setCopies()">
            📄 عدد النسخ:
            <input type="number" class="copies-input" id="copiesCount" value="1" min="1" max="10" onclick="event.stopPropagation()">
        </button>
    </div>

    <!-- حاوية الوصل -->
    <div class="receipt-wrapper" id="receiptWrapper">

        <div class="receipt" id="receiptTemplate">

            <!-- الختم الشفاف -->
            <div class="stamp-bg"></div>
            <div class="stamp-text-bg">
                <div class="stamp-title-bg">منتجات<br>أمين الساعدي</div>
                <div class="stamp-divider-bg"></div>
                <div class="stamp-sub-bg">AMIN AL-SAADI</div>
            </div>

            <!-- الهيدر -->
            <div class="receipt-header">
                <div class="brand-name">📦 منتجات أمين الساعدي</div>
                <div class="receipt-title">— وصل استلام طلب —</div>
                <div class="contact-info">📞 07702014853</div>
            </div>

            <!-- رقم الوصل والتاريخ -->
            <div class="meta-row">
                <div class="meta-item">
                    <span class="meta-label">رقم الوصل:</span>
                    <div class="meta-line"></div>
                </div>
                <div class="meta-item">
                    <span class="meta-label">التاريخ:</span>
                    <div class="meta-line"></div>
                </div>
            </div>

            <!-- الحقول -->
            <div class="fields">

                <div class="field-row">
                    <div class="field-label">اسم الزبون :</div>
                    <div class="field-line"></div>
                </div>

                <div class="field-row">
                    <div class="field-label">عنوان الزبون :</div>
                    <div class="field-line"></div>
                </div>

                <div class="field-row">
                    <div class="field-label">رقم الهاتف :</div>
                    <div class="field-line"></div>
                </div>

                <!-- السعر -->
                <div class="price-field">
                    <div class="price-label">💰 السعر الكامل :</div>
                    <div class="price-line"></div>
                    <div class="price-currency">د.ع</div>
                </div>

            </div>

            <!-- الفوتر -->
            <div class="receipt-footer">
                <div class="footer-thanks">شكراً لتعاملكم معنا ♥</div>
                <div class="footer-contact">
                    📞 <span>07702014853</span>
                </div>
                <div class="footer-brand">— منتجات أمين الساعدي —</div>
            </div>

        </div>

    </div>

    <script>
        function setCopies() {
            const count = parseInt(document.getElementById('copiesCount').value) || 1;
            const wrapper = document.getElementById('receiptWrapper');
            const template = document.getElementById('receiptTemplate');
            const originalHTML = template.outerHTML;

            wrapper.innerHTML = '';

            for (let i = 0; i < count; i++) {
                wrapper.insertAdjacentHTML('beforeend', originalHTML);
            }
        }
    </script>

</body>
</html>
